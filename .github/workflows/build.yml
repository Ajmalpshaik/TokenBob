name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

      - name: Publish TokenBob.exe
        shell: pwsh
        run: ./build/publish.ps1

      # Download it from this run's Summary page to try a build before it is released.
      - name: Upload TokenBob.exe
        uses: actions/upload-artifact@v4
        with:
          name: TokenBob
          path: publish/TokenBob.exe
          if-no-files-found: error
