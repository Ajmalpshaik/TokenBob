name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test -c Release

      - name: Publish TokenBob.exe
        shell: pwsh
        # The tag (v0.2.0) is the version the exe reports.
        run: ./build/publish.ps1 -Version ('${{ github.ref_name }}'.TrimStart('v'))

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" publish/TokenBob.exe --title "TokenBob ${{ github.ref_name }}" --generate-notes
