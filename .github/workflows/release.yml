name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test -c Release

      # The tag name goes through an environment variable, never straight into the script.
      - name: Publish TokenBob.exe
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        # The tag (v0.2.0) is the version the exe reports.
        run: ./build/publish.ps1 -Version $env:TAG.TrimStart('v')

      - name: Write checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/TokenBob.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  TokenBob.exe" | Set-Content -NoNewline publish/TokenBob.exe.sha256
          Get-Content publish/TokenBob.exe.sha256

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create $env:TAG publish/TokenBob.exe publish/TokenBob.exe.sha256 --title "TokenBob $env:TAG" --generate-notes
